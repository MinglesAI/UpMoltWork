# Deploy to production on push to main. Manual runs are the rollback path.
#
# No pull_request trigger on purpose: this repository is public, and a workflow
# that runs on forked PRs is a way to hand a stranger the deploy step. Build and
# test locally, or add a separate PR workflow that touches nothing outside the
# runner.
#
# The runner ships the checked-out tree to the server over rsync instead of the
# server pulling from GitHub. The server needs no GitHub access, no deploy key
# and no token, and what lands on disk is exactly the commit CI built.
#
# The base `.env` lives ON THE SERVER and never enters this repository: it holds
# the Supabase keys and database URLs. The deploy fails loudly when it is
# missing, which beats starting an API that cannot reach its database.
#
# Repository settings:
#   Secrets:   DEPLOY_SSH_KEY   — private key of the `deployer` user
#   Variables: DEPLOY_SSH_HOST  — production host
#              DEPLOY_SSH_USER  — defaults to `deployer`
#              DEPLOY_PATH      — defaults to /opt/UpMoltWork

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Ship the tree and bring the stack up
        env:
          SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -e
          USER="${SSH_USER:-deployer}"
          PATH_ON_SERVER="${DEPLOY_PATH:-/opt/UpMoltWork}"
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${USER}@${SSH_HOST}" "mkdir -p '${PATH_ON_SERVER}'"

          # --delete removes files dropped from the repository, so the excludes
          # have to be exact: .env holds the Supabase credentials.
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./ "${USER}@${SSH_HOST}:${PATH_ON_SERVER}/"

          REMOTE=$(cat <<REMOTE_EOF
          set -e
          cd '${PATH_ON_SERVER}'
          if [ ! -f .env ]; then
            echo "No .env in ${PATH_ON_SERVER} — put it on the server by hand" >&2
            exit 1
          fi
          echo '${{ github.sha }}' > DEPLOYED_SHA

          # IPv6-enabled network: a direct Supabase connection resolves over
          # IPv6 only, so without it the API cannot reach the database.
          # Created once, then reused.
          docker network inspect upmolt-ipv6 >/dev/null 2>&1 || docker network create --ipv6 upmolt-ipv6

          docker compose build
          docker compose up -d --remove-orphans
          docker compose ps
          REMOTE_EOF
          )
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${USER}@${SSH_HOST}" bash -s <<< "$REMOTE"

      - name: Check both hosts answer
        run: |
          for url in https://upmoltwork.mingles.ai https://api.upmoltwork.mingles.ai; do
            ok=""
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              # 401/403/404 still prove the container is up and routed; only a
              # connection failure or a 5xx means the deploy did not land.
              case "$code" in 2*|3*|401|403|404) ok="$code"; break;; esac
              sleep 5
            done
            if [ -n "$ok" ]; then echo "$url answered ($ok)"; else
              echo "$url did not answer within a minute (last code: $code)" >&2; exit 1; fi
          done
